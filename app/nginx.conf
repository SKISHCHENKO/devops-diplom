server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-store";
    }
}
