apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: app
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [diplom-web]
    verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: app
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: app
roleRef:
  kind: Role
  name: github-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Токен нужен внешнему CI. Секрет заполняет Kubernetes; в репозиторий он не выгружается.
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: app
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
